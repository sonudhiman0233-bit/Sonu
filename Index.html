<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>iPhone Solo</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #f2f2f7;
      text-align: center;
    }
    header {
      background: #000;
      color: white;
      padding: 30px 15px;
    }
    h1 {
      margin: 0;
      font-size: 32px;
    }
    .card {
      background: white;
      margin: 20px;
      padding: 20px;
      border-radius: 18px;
      box-shadow: 0 3px 12px #ccc;
    }
    .price {
      font-size: 22px;
      font-weight: bold;
    }
  </style>
</head>
<body>
<header>
  <h1>iPhone Solo</h1>
  <p>Choose your iPhone</p>
</header>
<div class="card">
  <h2>iPhone 15</h2>
  <p>Powerful. Beautiful. Simple.</p>
  <p class="price">₹69,999</p>
</div>
<div class="card">
  <h2>iPhone 15 Pro</h2>
  <p>Pro performance.</p>
  <p class="price">₹1,19,999</p>
</div>
<div class="card">
  <h2>iPhone 15 Pro Max</h2>
  <p>The ultimate iPhone.</p>
  <p class="price">₹1,39,999</p>
</div>
</body>
</html>
